<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta http-equiv="X-UA-Compatible" content="ie=edge"/>
  <title>{% block title %}SeqLit — Sequence Analysis & Literature Dashboard{% endblock %}</title>
  
  <!-- Tabler Core CSS (CDN) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/css/tabler-flags.min.css">
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- Chart.js -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="/static/css/custom.css">
</head>
<body class="layout-boxed">
  <div class="page">
    <!-- Navbar -->
    <header class="navbar navbar-expand-md navbar-dark d-print-none bg-primary">
      <div class="container-xl">
        <h1 class="navbar-brand navbar-brand-autodark d-none-navbar-horizontal pe-0 pe-md-3">
          <a href="/" class="text-white text-decoration-none d-flex align-items-center gap-2">
            <i data-lucide="dna" style="width: 28px; height: 28px;"></i>
            <span class="fw-bold tracking-tight">SeqLit</span>
            <span class="badge bg-blue-lt text-white ms-2 fs-6">Bioinformatics</span>
          </a>
        </h1>
        <div class="navbar-nav flex-row order-md-last align-items-center gap-3">
          <a href="https://github.com/rizwanahmed2603-byte/SQLit" target="_blank" class="btn btn-sm btn-outline-light d-flex align-items-center gap-1">
            <i data-lucide="github" style="width: 16px; height: 16px;"></i>
            <span>GitHub</span>
          </a>
          <span class="badge bg-green text-white">v1.0 Ready</span>
        </div>
      </div>
    </header>

    <!-- Page Content -->
    <div class="page-wrapper">
      {% block content %}{% endblock %}

      <footer class="footer footer-transparent d-print-none mt-auto py-3">
        <div class="container-xl text-center text-secondary fs-5">
          SeqLit — Minor Project Pipeline &bull; DNA/RNA/Protein Analysis, Homology & PubMed Literature
        </div>
      </footer>
    </div>
  </div>

  <!-- Tabler Core JS -->
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0-beta20/dist/js/tabler.min.js" defer></script>
  
  <!-- Custom JS -->
  <script src="/static/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
